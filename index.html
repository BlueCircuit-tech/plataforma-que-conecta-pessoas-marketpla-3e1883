<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Nexo — Conecta Pessoas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca: {
                            50: '#eef4fb', 100: '#d4e5f6', 200: '#a9cbee', 300: '#7eb1e6',
                            400: '#5397de', 500: '#2563EB', 600: '#1d56c4', 700: '#16429d',
                            800: '#0f2f76', 900: '#1E3A5F',
                        },
                    },
                    fontFamily: {
                        display: ['Outfit', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 2px 12px rgba(30,58,95,0.07)',
                        'nav': '0 -4px 20px rgba(30,58,95,0.08)',
                        'toast': '0 4px 16px rgba(0,0,0,0.15)',
                    },
                    borderRadius: { 'app': '32px' },
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-display { font-family: 'Outfit', sans-serif; }

        [data-tela] { animation: fadeSlide 0.28s ease-out; }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        *:focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; border-radius: 4px; }

        .nav-ativo { color: #2563EB !important; }
        .nav-ativo svg { stroke: #2563EB; }
        .nav-ativo::after {
            content: ''; position: absolute; top: -1px; left: 50%;
            transform: translateX(-50%); width: 20px; height: 3px;
            background: #2563EB; border-radius: 0 0 3px 3px;
        }

        .badge {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.02em;
            padding: 2px 8px; border-radius: 9999px; white-space: nowrap;
        }
        .card {
            background: #fff; border-radius: 16px;
            box-shadow: 0 2px 12px rgba(30,58,95,0.07);
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700; border-radius: 14px; border: none; cursor: pointer;
            transition: all 0.18s ease; user-select: none; padding: 14px 24px;
            font-size: 0.95rem; color: #fff;
        }
        .btn:active { transform: scale(0.97); }
        .btn-outline {
            background: transparent; color: #1E3A5F;
            border: 1.5px solid #d4e5f6;
        }
        .btn-outline:active { background: #eef4fb; }
        .btn-ghost { background: transparent; color: #1E3A5F; }
        .btn-ghost:hover { background: #f1f5f9; }
    </style>
</head>
<body class="bg-slate-800 min-h-screen flex items-start justify-center py-4 md:py-6">

    <div class="w-full max-w-[430px] md:mx-auto bg-marca-900 md:rounded-app md:shadow-2xl overflow-hidden relative" style="min-height: 780px;">

        <!-- Status Bar -->
        <div class="flex items-center justify-between px-7 pt-3 pb-1" style="background: #1E3A5F;">
            <span class="text-white/90 text-xs font-medium font-body" id="clock"></span>
            <div class="flex items-center gap-1.5">
                <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="0" y="5" width="3" height="7" rx="0.8" fill="#fff" opacity="0.35"/><rect x="4.5" y="3.5" width="3" height="8.5" rx="0.8" fill="#fff" opacity="0.55"/><rect x="9" y="1.5" width="3" height="10.5" rx="0.8" fill="#fff" opacity="0.75"/><rect x="13.5" y="0" width="3" height="12" rx="0.8" fill="#fff"/><circle cx="9" cy="1" r="1.2" fill="#fff" opacity="0.5"/></svg>
                <svg width="14" height="12" viewBox="0 0 14 12" fill="none"><path d="M7 8.5a3 3 0 0 0 3-3c0-1.66-1.34-3-3-3s-3 1.34-3 3a3 3 0 0 0 3 3Z" stroke="#fff" stroke-width="1.1" opacity="0.9"/><path d="M2 8.5a5 5 0 0 1 10 0" stroke="#fff" stroke-width="1.1" opacity="0.4" fill="none"/></svg>
                <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="#fff" stroke-width="0.8" opacity="0.4"/><rect x="2" y="2" width="16" height="7" rx="1.5" fill="#fff" opacity="0.9"/><rect x="21" y="3.5" width="2" height="4" rx="0.5" fill="#fff" opacity="0.6"/></svg>
            </div>
        </div>

        <!-- App Header -->
        <header class="flex items-center justify-between px-5 pt-3 pb-2" style="background: #1E3A5F;">
            <div class="flex items-center gap-2.5">
                <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
                    <rect width="34" height="34" rx="10" fill="#2563EB"/>
                    <path d="M10 24V13l7 5.5L24 13v11h-3.5v-6.5L17 20l-3.5-2.5V24H10z" fill="#fff" opacity="0.95"/>
                </svg>
                <span class="font-display font-800 text-white text-xl tracking-tight">Nexo</span>
            </div>
            <button class="relative p-2 text-white/70 hover:text-white transition-colors" data-nav="chat" onclick="mostrarTela('chat')" aria-label="Notificações">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-400 rounded-full"></span>
            </button>
        </header>

        <!-- Telas -->
        <main class="overflow-y-auto pb-24" style="background: #F8FAFC; height: 620px;" id="app-main">
            <!-- TELAS -->
        </main>

        <!-- Bottom Nav -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white shadow-nav z-50 flex justify-around items-center px-1 pt-2 pb-5" style="padding-bottom: max(20px, env(safe-area-inset-bottom));" aria-label="Navegação principal">
            <button class="flex flex-col items-center gap-1 py-1 px-3 relative text-marca-900/40 transition-colors duration-200 nav-ativo" data-nav="home-descobrir" onclick="mostrarTela('home-descobrir')" aria-label="Descobrir">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="text-[10px] font-semibold">Início</span>
            </button>
            <button class="flex flex-col items-center gap-1 py-1 px-3 relative text-marca-900/40 transition-colors duration-200" data-nav="catalogo-e-busca" onclick="mostrarTela('catalogo-e-busca')" aria-label="Catálogo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <span class="text-[10px] font-semibold">Buscar</span>
            </button>
            <button class="flex flex-col items-center gap-1 py-1 px-3 relative text-marca-900/40 transition-colors duration-200" data-nav="carteira-sicardi" onclick="mostrarTela('carteira-sicardi')" aria-label="Carteira">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                <span class="text-[10px] font-semibold">Carteira</span>
            </button>
            <button class="flex flex-col items-center gap-1 py-1 px-3 relative text-marca-900/40 transition-colors duration-200" data-nav="meus-pedidos" onclick="mostrarTela('meus-pedidos')" aria-label="Pedidos">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span class="text-[10px] font-semibold">Pedidos</span>
            </button>
            <button class="flex flex-col items-center gap-1 py-1 px-3 relative text-marca-900/40 transition-colors duration-200" data-nav="chat" onclick="mostrarTela('chat')" aria-label="Chat">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span class="text-[10px] font-semibold">Chat</span>
            </button>
        </nav>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[999] flex flex-col gap-2 pointer-events-none" style="max-width: 360px;"></div>

        <!-- Modal -->
        <div id="modal" class="hidden fixed inset-0 z-[900] items-center justify-center p-4" style="background: rgba(15,23,42,0.55); backdrop-filter: blur(3px);">
            <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                <div class="flex items-center justify-between px-5 pt-5 pb-3">
                    <h3 class="font-display font-700 text-marca-900 text-lg" id="modal-title"></h3>
                    <button onclick="fecharModal()" class="p-1.5 rounded-full hover:bg-slate-100 transition-colors" aria-label="Fechar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="px-5 pb-5 max-h-[60vh] overflow-y-auto" id="modal-body"></div>
            </div>
        </div>
    </div>

    <script>
        // ─── Clock ───
        function tick() {
            const d = new Date();
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const el = document.getElementById('clock');
            if (el) el.textContent = h + ':' + m;
        }
        tick(); setInterval(tick, 30000);

        // ─── Router ───
        function mostrarTela(id) {
            document.querySelectorAll('[data-tela]').forEach(function(s) {
                s.classList.toggle('hidden', s.dataset.tela !== id);
            });
            document.querySelectorAll('[data-nav]').forEach(function(b) {
                b.classList.toggle('nav-ativo', b.dataset.nav === id);
            });
            window.scrollTo({ top: 0 });
        }

        document.addEventListener('DOMContentLoaded', function() {
            mostrarTela('home-descobrir');
        });

        // ─── Formatadores ───
        function brl(valor) {
            return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
        }
        function dataBR(iso) {
            var p = iso.split('-');
            return p[2] + '/' + p[1] + '/' + p[0];
        }

        // ─── Toasts ───
        function toast(mensagem, tipo) {
            var container = document.getElementById('toast-container');
            var cores = { ok: '#059669', erro: '#dc2626', info: '#2563EB' };
            var icones = {
                ok: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
                erro: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
                info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
            };
            var el = document.createElement('div');
            el.className = 'pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white text-sm font-semibold shadow-toast';
            el.style.cssText = 'background:' + cores[tipo] + '; animation: toastIn 0.3s ease-out;';
            el.innerHTML = icones[tipo] + '<span>' + mensagem + '</span>';
            container.appendChild(el);
            setTimeout(function() {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-10px)';
                el.style.transition = 'all 0.3s ease';
                setTimeout(function() { el.remove(); }, 300);
            }, 3000);
        }
        var toastCSS = document.createElement('style');
        toastCSS.textContent = '@keyframes toastIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}';
        document.head.appendChild(toastCSS);

        // ─── Modal ───
        function abrirModal(html, titulo) {
            document.getElementById('modal-title').textContent = titulo;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }
        function fecharModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
            document.body.style.overflow = '';
        }
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') fecharModal();
        });
    </script>
</body>
</html>
