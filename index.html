    var cheias = Math.floor(nota);
    var meia = nota - cheias >= 0.5 ? 1 : 0;
    var vazias = 5 - cheias - meia;
    var html = '';
    for (var i = 0; i < cheias; i++) html += '<svg class="w-3 h-3 text-amber-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
    if (meia) html += '<svg class="w-3 h-3 text-amber-400" viewBox="0 0 20 20"><defs><linearGradient id="half"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="#D1D5DB"/></linearGradient></defs><path fill="url(#half)" stroke="currentColor" stroke-width="0.5" d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
    for (var j = 0; j < vazias; j++) html += '<svg class="w-3 h-3 text-gray-200 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
    return html;
  }

  function cardProduto(prod, destaque) {
    var desc = Math.round((1 - prod.preco / prod.precoAntigo) * 100);
    return '<div onclick="mostrarTela(\'detalhe-do-produto\')" class="card bg-white rounded-xl overflow-hidden active:scale-[0.97] transition-all cursor-pointer flex flex-col">' +
      '<div class="relative ' + GRADIENTES[prod.grad] + ' h-36 flex items-center justify-center">' +
        '<span class="text-white/30 text-5xl font-display font-bold">' + prod.nome.charAt(0) + '</span>' +
        (destaque ? '<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-body font-bold px-1.5 py-0.5 rounded-md">-' + desc + '%</span>' : '') +
        '<button onclick="event.stopPropagation(); home_descobrir_favoritar(' + prod.id + ')" class="absolute top-2 right-2 w-7 h-7 bg-white/80 backdrop-blur-sm rounded-full flex items-center justify-center active:scale-90 transition-all" id="fav-btn-' + prod.id + '">' +
          '<svg class="w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="p-3 flex flex-col flex-1">' +
        '<p class="text-sm font-body font-medium text-gray-800 leading-tight line-clamp-2 mb-1">' + prod.nome + '</p>' +
        '<p class="text-xs text-gray-400 font-body mb-1.5">' + prod.vendedor + '</p>' +
        '<div class="flex items-center gap-1 mb-2">' + estrelas(prod.nota) + '<span class="text-xs text-gray-400 font-body ml-1">' + prod.avaliacoes.toLocaleString('pt-BR') + '</span></div>' +
        '<div class="mt-auto">' +
          '<div class="flex items-center gap-2 flex-wrap">' +
            '<span class="text-base font-display font-bold text-marca-600">' + brl(prod.preco) + '</span>' +
            (destaque ? '<span class="text-xs text-gray-400 line-through font-body">' + brl(prod.precoAntigo) + '</span>' : '') +
          '</div>' +
          '<span class="text-xs text-gray-500 font-body">' + prod.parcela + ' sem juros</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  window.home_descobrir_buscar = function(termo) {
    var cards = document.querySelectorAll('#destaques-grid .card');
    var visivel = 0;
    if (!termo.trim()) { cards.forEach(function(c) { c.classList.remove('hidden'); }); document.getElementById('destaques-grid').className = 'grid grid-cols-2 gap-3 px-4'; return; }
    var t = termo.toLowerCase();
    cards.forEach(function(c) {
      var nome = c.querySelector('.text-sm.font-body.font-medium');
      var vendedor = c.querySelectorAll('.text-xs.text-gray-400.font-body')[0];
      var txt = (nome ? nome.textContent : '') + ' ' + (vendedor ? vendedor.textContent : '');
      if (txt.toLowerCase().indexOf(t) !== -1) { c.classList.remove('hidden'); visivel++; }
      else { c.classList.add('hidden'); }
    });
    if (visivel === 0) {
      var grid = document.getElementById('destaques-grid');
      if (!document.getElementById('busca-vazia')) {
        var empty = document.createElement('div');
        empty.id = 'busca-vazia';
        empty.className = 'col-span-2 flex flex-col items-center justify-center py-8';
        empty.innerHTML = '<svg class="w-12 h-12 text-gray-300 mb-2" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg><p class="text-sm text-gray-400 font-body">Nenhum resultado para "' + termo + '"</p><button onclick="home_descobrir_buscar(\'\')" class="text-sm text-marca-600 font-body font-medium mt-1">Limpar busca</button>';
        grid.appendChild(empty);
      } else {
        var eb = document.getElementById('busca-vazia');
        if (eb) { eb.querySelector('p').textContent = 'Nenhum resultado para "' + termo + '"'; eb.classList.remove('hidden'); }
      }
    } else {
      var ev = document.getElementById('busca-vazia');
      if (ev) ev.classList.add('hidden');
    }
  };

  window.home_descobrir_favoritar = function(id) {
    var btn = document.getElementById('fav-btn-' + id);
    if (!btn) return;
    var svg = btn.querySelector('svg');
    var jaFav = svg.getAttribute('fill') !== 'none';
    if (jaFav) {
      svg.setAttribute('fill', 'none');
      svg.classList.remove('text-red-500'); svg.classList.add('text-gray-400');
      toast('Removido dos favoritos', 'info');
    } else {
      svg.setAttribute('fill', 'currentColor');
      svg.classList.remove('text-gray-400'); svg.classList.add('text-red-500');
      toast('Adicionado aos favoritos!', 'ok');
    }
  };

  function timerTick() {
    var agora = new Date();
    var fim = new Date(agora); fim.setHours(23, 59, 59, 999);
    var diff = fim - agora;
    if (diff < 0) diff = 0;
    var h = Math.floor(diff / 3600000);
    var m = Math.floor((diff % 3600000) / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    var el = document.getElementById('relampago-timer');
    if (el) el.textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function render() {
    var relList = document.getElementById('relampago-lista');
    if (relList) {
      relList.innerHTML = PRODUTOS_RELAMPAGO.map(function(p) {
        var desc = Math.round((1 - p.preco / p.precoAntigo) * 100);
        return '<div onclick="mostrarTela(\'detalhe-do-produto\')" class="min-w-[160px] bg-white rounded-xl overflow-hidden shadow-sm active:scale-[0.97] transition-all cursor-pointer flex-shrink-0">' +
          '<div class="relative ' + GRADIENTES[p.grad] + ' h-28 flex items-center justify-center">' +
            '<span class="text-white/30 text-4xl font-display font-bold">' + p.nome.charAt(0) + '</span>' +
            '<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-body font-bold px-1.5 py-0.5 rounded-md">-' + desc + '%</span>' +
          '</div>' +
          '<div class="p-2.5">' +
            '<p class="text-xs font-body font-medium text-gray-800 leading-tight line-clamp-2 mb-1">' + p.nome + '</p>' +
            '<span class="text-sm font-display font-bold text-marca-600">' + brl(p.preco) + '</span>' +
            '<span class="text-xs text-gray-400 line-through font-body ml-1">' + brl(p.precoAntigo) + '</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    var grid = document.getElementById('destaques-grid');
    if (grid) {
      grid.innerHTML = PRODUTOS_DESTAQUE.map(function(p) { return cardProduto(p, true); }).join('');
    }

    var vList = document.getElementById('vendedores-lista');
    if (vList) {
      vList.innerHTML = VENDEDORES.map(function(v) {
        return '<div class="bg-white rounded-xl p-3 shadow-sm min-w-[130px] flex-shrink-0 active:scale-95 transition-all cursor-pointer" onclick="toast(\'Loja ' + v.nome + ' — ' + v.vendas + ' vendas realizadas\', \'info\')">' +
          '<div class="flex items-center gap-2.5 mb-2">' +
            '<div class="w-10 h-10 bg-gradient-to-br ' + v.cor + ' rounded-full flex items-center justify-center text-white text-xs font-body font-bold">' + v.avatar + '</div>' +
            '<div><p class="text-sm font-body font-semibold text-gray-800 leading-tight">' + v.nome + '</p><p class="text-[10px] text-gray-400 font-body">' + v.tempo + '</p></div>' +
          '</div>' +
          '<div class="flex items-center gap-1 mb-1">' + estrelas(v.nota) + '<span class="text-xs font-body text-gray-600 ml-1">' + v.nota + '</span></div>' +
          '<p class="text-[10px] text-gray-400 font-body">' + v.vendas + ' vendas</p>' +
        '</div>';
      }).join('');
    }
  }

  document.addEventListener('telaAtiva', function(e) {
    if (e.detail === 'home-descobrir') {
      render();
      timerTick();
      var buscaEl = document.getElementById('home-busca');
      if (buscaEl) buscaEl.value = '';
    }
  });

  var timerInterval;
  document.addEventListener('telaAtiva', function(e) {
    if (e.detail === 'home-descobrir') {
      clearInterval(timerInterval);
      timerInterval = setInterval(timerTick, 1000);
    } else {
      clearInterval(timerInterval);
    }
  });

  render();
  timerTick();
  timerInterval = setInterval(timerTick, 1000);
})();
</script>

        <!-- Toast Container -->
        <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[999] flex flex-col gap-2 pointer-events-none" style="max-width: 360px;"></div>

        <!-- Modal -->
        <div id="modal" class="hidden fixed inset-0 z-[900] items-center justify-center p-4" style="background: rgba(15,23,42,0.55); backdrop-filter: blur(3px);">
            <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                <div class="flex items-center justify-between px-5 pt-5 pb-3">
                    <h3 class="font-display font-700 text-marca-900 text-lg" id="modal-title"></h3>
                    <button onclick="fecharModal()" class="p-1.5 rounded-full hover:bg-slate-100 transition-colors" aria-label="Fechar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="px-5 pb-5 max-h-[60vh] overflow-y-auto" id="modal-body"></div>
            </div>
        </div>

    <script>
        // ─── Clock ───
        function tick() {
            const d = new Date();
            const h = String(d.getHours()).padStart(2, '0');
            const m = String(d.getMinutes()).padStart(2, '0');
            const el = document.getElementById('clock');
            if (el) el.textContent = h + ':' + m;
        }
        tick(); setInterval(tick, 30000);

        // ─── Router ───
        function mostrarTela(id) {
            document.querySelectorAll('[data-tela]').forEach(function(s) {
                s.classList.toggle('hidden', s.dataset.tela !== id);
            });
            document.querySelectorAll('[data-nav]').forEach(function(b) {
                b.classList.toggle('nav-ativo', b.dataset.nav === id);
            });
            window.scrollTo({ top: 0 });
        }

        document.addEventListener('DOMContentLoaded', function() {
            mostrarTela('home-descobrir');
        });

        // ─── Formatadores ───
        function brl(valor) {
            return 'R$ ' + Number(valor).toFixed(2).replace('.', ',');
        }
        function dataBR(iso) {
            var p = iso.split('-');
            return p[2] + '/' + p[1] + '/' + p[0];
        }

        // ─── Toasts ───
        function toast(mensagem, tipo) {
            var container = document.getElementById('toast-container');
            var cores = { ok: '#059669', erro: '#dc2626', info: '#2563EB' };
            var icones = {
                ok: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',
                erro: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
                info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
            };
            var el = document.createElement('div');
            el.className = 'pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl text-white text-sm font-semibold shadow-toast';
            el.style.cssText = 'background:' + cores[tipo] + '; animation: toastIn 0.3s ease-out;';
            el.innerHTML = icones[tipo] + '<span>' + mensagem + '</span>';
            container.appendChild(el);
            setTimeout(function() {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-10px)';
                el.style.transition = 'all 0.3s ease';
                setTimeout(function() { el.remove(); }, 300);
            }, 3000);
        }
        var toastCSS = document.createElement('style');
        toastCSS.textContent = '@keyframes toastIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}';
        document.head.appendChild(toastCSS);

        // ─── Modal ───
        function abrirModal(html, titulo) {
            document.getElementById('modal-title').textContent = titulo;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
            document.body.style.overflow = 'hidden';
        }
        function fecharModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('modal').classList.remove('flex');
            document.body.style.overflow = '';
        }
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) fecharModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') fecharModal();
        });
    </script>
